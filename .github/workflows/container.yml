name: container

# Builds ghcr.io/nachtschatt3n/gods-eye-view from the latest UPSTREAM release
# tag (bilawalsidhu/gods-eye-view), with the packaging in docker/ overlaid.
# Weekly schedule = pick up new upstream releases AND rebuild the base for CVEs
# (docs/sops/self-built-image-rebuild.md in cberg-home-nextgen).
#
# Deliberately NO pull_request / push trigger: an image is only ever built from
# a reviewed upstream release tag, never from branch code (SOP trap 6c).

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream release tag to build (default: latest release)"
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nachtschatt3n/gods-eye-view
  UPSTREAM: bilawalsidhu/gods-eye-view

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve upstream release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
        run: |
          tag="${INPUT_TAG:-$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)}"
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "unexpected tag '$tag'"; exit 1;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "build=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Checkout packaging (this fork)
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Checkout upstream release
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.rel.outputs.tag }}
          path: app

      - name: Overlay packaging
        run: |
          cp packaging/docker/Dockerfile app/Dockerfile
          cp packaging/docker/.dockerignore app/.dockerignore

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (loaded locally so the SMOKE-TESTED image is what gets pushed)
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.rel.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.rel.outputs.version }}-b${{ steps.rel.outputs.build }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.rel.outputs.version }}
            org.opencontainers.image.revision=${{ steps.rel.outputs.tag }}
            org.opencontainers.image.licenses=MIT
          # Always resolve the base fresh and never replay the OS-upgrade layer
          # from cache — a cached OS layer is how a "rebuilt" image keeps
          # shipping already-fixed CVEs.
          pull: true
          no-cache: true
          provenance: false

      - name: Smoke test (keyless boot serves the app and a static asset)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.rel.outputs.version }}
        run: |
          docker run -d --name gev -p 4173:4173 --read-only \
            --tmpfs /tmp --tmpfs /app/.gev-cache:uid=1000 --tmpfs /app/.gev-logs:uid=1000 \
            --tmpfs /app/node_modules/.vite:uid=1000 --tmpfs /app/node_modules/.vite-temp:uid=1000 "$IMAGE"
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:4173/logo.svg 2>/dev/null && break
            [ "$(docker inspect -f '{{.State.Running}}' gev)" = true ] || { docker logs gev; exit 1; }
            sleep 2
          done
          curl -fsS http://localhost:4173/ | grep -qi '<html' || { docker logs gev; exit 1; }
          curl -fsS -o /dev/null http://localhost:4173/logo.svg || { docker logs gev; exit 1; }
          docker logs gev 2>&1 | tail -20
          docker rm -f gev

      - name: Push
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.rel.outputs.version }}
          BUILD: ${{ steps.rel.outputs.build }}
        run: |
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION-b$BUILD"
          docker buildx imagetools inspect "$IMAGE:$VERSION-b$BUILD" --format '{{json .Manifest.Digest}}'
